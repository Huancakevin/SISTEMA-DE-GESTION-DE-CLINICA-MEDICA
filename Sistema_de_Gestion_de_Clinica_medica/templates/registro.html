<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestión de Clínica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f4f8b 0%, #163d6d 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .registro-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        
        .registro-container h1 {
            color: #1f4f8b;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2rem;
        }
        
        .registro-container p {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            color: #2d3a4b;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd3df;
            border-radius: 8px;
            background: #f9fbff;
            font-size: 0.95rem;
            color: #2d3a4b;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1f4f8b;
            box-shadow: 0 0 5px rgba(31, 79, 139, 0.2);
        }
        
        .form-group button {
            width: 100%;
            padding: 12px;
            background: #1f4f8b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .form-group button:hover {
            background: #163d6d;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #fcc;
            font-size: 0.9rem;
        }
        
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #cfc;
            font-size: 0.9rem;
        }
        
        .link-container {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        
        .link-container a {
            color: #1f4f8b;
            text-decoration: none;
            font-weight: 600;
        }
        
        .link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="registro-container">
        <h1>Crear Cuenta</h1>
        <p>Registro de nuevo usuario</p>
        
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        
        {% if exito %}
            <div class="success-message">{{ exito }}</div>
            <script>
                setTimeout(function(){
                    window.location.href = '/login';
                }, 2000);
            </script>
        {% endif %}
        
        {% if not exito %}
        <form method="POST" action="/registro">
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="Mínimo 6 caracteres" required>
            </div>
            
            <div class="form-group">
                <label for="confirmar">Confirmar Contraseña:</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Confirme su contraseña" required>
            </div>
            
            <div class="form-group">
                <button type="submit">Registrarse</button>
            </div>
        </form>
        
        <div class="link-container">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
